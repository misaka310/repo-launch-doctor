name: Public history secret audit

on:
  push:
    branches:
      - security/public-history-audit-20261015
    paths:
      - audits/public_history_secret_audit.py
      - .github/workflows/public-history-secret-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - audits/public_history_secret_audit.py
      - .github/workflows/public-history-secret-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: public-history-secret-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: History audit (${{ matrix.repo }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repo:
          - task-picker
          - chatgpt_chat_view
          - local-voice-bridge
          - youtube-dictation-pause-control
          - mouse-battery-tray
          - local-finance-dashboard
          - shareclip
          - repo-launch-doctor
          - video-highlights-site
          - aws-saa-c03-study
          - fe-study
          - local-tts-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone complete public history
        run: git clone --mirror --quiet "https://github.com/misaka310/${{ matrix.repo }}.git" target.git

      - name: Scan added lines across all refs
        run: python audits/public_history_secret_audit.py --repo-dir target.git --repo-name "misaka310/${{ matrix.repo }}"
